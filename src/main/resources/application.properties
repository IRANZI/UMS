spring.application.name=Utility-Billing-System

# Server
server.port=8081

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/utility_billing_db
spring.datasource.username=postgres
spring.datasource.password=user
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# SQL scripts (triggers & procedures)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/routines.sql
spring.sql.init.separator=@@
spring.sql.init.continue-on-error=true

# JWT
app.jwt.secret=UtilityBillingSystemSecretKeyForJWTTokenGenerationMustBeLongEnough2024WASACREG
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# Email (Gmail SMTP) — defaults below; secrets overridden by application-local.properties at end of file
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mrshhh39@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
app.mail.from=no-reply@gmail.com
app.mail.enabled=true

# System access URL (included in credential and role emails)
app.system.login-url=http://localhost:8081/swagger-ui.html

# OTP
app.otp.expiry-minutes=10
app.otp.length=6

# File Upload
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.default-flat-param-object=true

# Logging
logging.level.com.java.Utility.Billing.System=DEBUG
logging.level.org.springframework.security=INFO

# IMPORTANT: Load local secrets LAST so application-local.properties overrides everything above.
# Put spring.mail.password here — NOT in this file.
spring.config.import=optional:classpath:application-local.properties
